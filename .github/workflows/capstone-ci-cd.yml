name: Capstone Spring Boot Microservices CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ====================================================
  # Stage 1: Build & Unit Test Spring Boot Services
  # ====================================================
  test-services:
    name: Build & Test Maven Microservices
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [order-service, notification-service]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile and Run Tests
        working-directory: 05-Hands-On-Capstone-Project/${{ matrix.service }}
        run: mvn clean test -B

  # ====================================================
  # Stage 2: Build Multi-Stage Docker Images & Security Scan
  # ====================================================
  build-and-scan:
    name: Build & Scan Docker Images
    needs: test-services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [order-service, notification-service]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build image locally for Trivy scanning
      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: 05-Hands-On-Capstone-Project/${{ matrix.service }}
          load: true
          tags: ${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Security Gate: Trivy Scan
      - name: Run Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.service }}:${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  # ====================================================
  # Stage 3: Validate Kubernetes Manifests
  # ====================================================
  validate-k8s:
    name: Dry-Run K8s Manifest Validation
    needs: build-and-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Dry-run validate Kubernetes YAMLs
        run: |
          echo "Validating Kubernetes manifests syntax..."
          kubectl apply --dry-run=client -f 05-Hands-On-Capstone-Project/k8s/
